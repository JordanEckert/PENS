[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pens-tda"
version = "1.0.0"
description = "Persistence-Edited Net Selection: supervised prototype selection with a certificate on class-wise persistent homology"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Eckert", email = "jpe0018@auburn.edu" }]
keywords = [
    "topological data analysis",
    "persistent homology",
    "prototype selection",
    "epsilon-net",
    "data reduction",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
certificate = ["ripser>=0.6", "gudhi>=3.8"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/JordanEckert/PENS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
